name: Crawl related songs

on:
  schedule:
    - cron: "17 3 * * *"      # daily; each run adds more songs to related.json
  workflow_dispatch:           # lets you run it by hand from the Actions tab
    inputs:
      max_new:
        description: "How many songs to crawl this run"
        default: "250"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ytmusicapi
      - name: Crawl
        env:
          MAX_NEW: ${{ github.event.inputs.max_new || '250' }}
        run: python crawl_related.py
      - name: Commit results
        run: |
          git config user.name "meow-crawler"
          git config user.email "meow-crawler@users.noreply.github.com"
          git add related.json
          git diff --cached --quiet || (git commit -m "Update related.json" && git push)
