<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meow Music</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: #fffdf8;
      --ink: #171717;
      --muted: #6d685e;
      --accent: #ff6b57;
      --accent-2: #8f6bff;
      --side: #e8e1d6;
      --line: #1a1a1a;
      --good: #17b26a;
      --shadow: rgba(0, 0, 0, 0.12);
      --danger: #ff5d8f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 20px;
    }

    .app {
      width: min(1200px, 100%);
      min-height: 760px;
      display: grid;
      grid-template-columns: 260px 1fr 360px;
      border: 3px solid var(--line);
      background: var(--panel);
      box-shadow: 10px 10px 0 var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      background: var(--side);
      border-right: 3px solid var(--line);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      position: relative;
      box-shadow: 3px 3px 0 var(--line);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
      width: 7px;
      height: 7px;
      left: 7px;
      top: 8px;
    }

    .brand-mark::after {
      left: 16px;
    }

    .sidebar-section {
      display: grid;
      gap: 8px;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 10px;
      font-weight: 700;
    }

    .playlist-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: 2px solid transparent;
      background: transparent;
      color: var(--ink);
      padding: 10px 8px;
      text-align: left;
      cursor: pointer;
      transition: .15s ease;
    }

    .playlist-item:hover {
      background: rgba(255,255,255,0.45);
      border-color: var(--line);
    }

    .playlist-item.active {
      background: var(--panel);
      border-color: var(--line);
      box-shadow: 4px 4px 0 var(--accent);
    }

    .playlist-pill {
      font-size: 0.62rem;
      background: #fff;
      border: 2px solid var(--line);
      padding: 4px 6px;
      font-weight: 800;
      letter-spacing: 1px;
      min-width: 42px;
      text-align: center;
    }

    .playlist-item.active .playlist-pill {
      background: var(--accent);
      color: #fff;
    }

    .playlist-name {
      flex: 1;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .playlist-count {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--panel);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 3px solid var(--line);
      padding: 16px 18px;
      background: rgba(255,255,255,0.5);
    }

    .title {
      font-size: clamp(1.1rem, 1vw + 0.8rem, 2rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
      min-width: 220px;
      flex: 1;
      max-width: 360px;
    }

    .search-wrap input {
      width: 100%;
      border: 3px solid var(--line);
      background: var(--bg);
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      outline: none;
    }

    .content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
      overflow: auto;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 3px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s ease; 
    }

    button:hover { transform: translate(-1px, -1px); }
    button:active { transform: translate(2px, 2px); }

    .primary {
      background: var(--accent);
      color: #111;
      box-shadow: 4px 4px 0 var(--line);
    }

    .ghost {
      background: #fff;
    }

    .music-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
      min-height: 0;
    }

    .track {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 110px 120px 120px;
      gap: 12px;
      align-items: center;
      border: 3px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
      transition: background .12s ease, transform .12s ease;
    }

    .track:hover {
      background: #fff9f1;
    }

    .track.active {
      background: var(--ink);
      color: #fff;
    }

    .track-number {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--muted);
    }

    .track.active .track-number { color: #ffe9a6; }

    .track-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-title {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track.active .track-artist { color: rgba(255,255,255,0.75); }

    .meta-badge {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .heart {
      border: 0;
      background: transparent;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--muted);
      min-width: auto;
    }

    .heart.liked {
      color: var(--danger);
    }

    .queue-btn, .share-btn, .lyrics-btn {
      width: 100%;
      font-size: 0.8rem;
      padding: 8px 10px;
    }

    .empty {
      color: var(--muted);
      border: 3px dashed var(--line);
      padding: 24px 18px;
      text-align: center;
      background: rgba(255,255,255,0.35);
      font-weight: 700;
    }

    .right-panel {
      border-left: 3px solid var(--line);
      background: var(--panel);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid var(--line);
      background: linear-gradient(135deg, #ffb9a8, #bca9ff);
      display: grid;
      place-items: center;
      box-shadow: 8px 8px 0 var(--accent);
      font-size: 4rem;
      font-weight: 900;
      overflow: hidden;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .now-playing-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-name {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.1;
      word-break: break-word;
    }

    .artist-name {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.85rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .control-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 1.2rem;
      background: var(--panel);
    }

    .control-btn.primary {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      font-size: 1.6rem;
    }

    .small-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .lyrics-panel {
      border: 3px solid var(--line);
      background: linear-gradient(180deg, #fffaf5, #f8f4ff);
      min-height: 180px;
      max-height: 260px;
      overflow: auto;
      padding: 12px;
      display: none;
    }

    .lyrics-panel.visible {
      display: block;
    }

    .lyric-line {
      padding: 8px 4px;
      border-left: 3px solid transparent;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      transition: .15s ease;
    }

    .lyric-line.active {
      color: var(--ink);
      border-color: var(--accent);
      background: rgba(255,107,87,0.08);
      font-weight: 800;
      transform: translateX(2px);
    }

    @media (max-width: 980px) {
      body { padding: 10px; }
      .app {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .sidebar, .right-panel {
        border: none;
        border-bottom: 3px solid var(--line);
      }
      .right-panel { border-bottom: none; }
      .track {
        grid-template-columns: 36px minmax(0, 1fr) 100px 90px;
      }
      .track .queue-btn, .track .share-btn { display: none; }
      .track .like-btn { justify-self: end; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Meow Music</span>
      </div>

      <div class="sidebar-section">
        <button class="primary" id="newPlaylistBtn" type="button">+ New Playlist</button>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Your playlists</div>
        <ul class="playlist-list" id="playlistSidebar"></ul>
      </div>
    </aside>

    <main class="main-panel">
      <div class="topbar">
        <div class="title" id="playlistTitle">My Playlist</div>
        <div class="search-wrap">
          <input id="filterInput" type="search" placeholder="Filter songs..." aria-label="Filter songs" />
        </div>
      </div>

      <div class="content">
        <div class="toolbar">
          <button class="primary" type="button" id="playAllBtn">Play all</button>
          <button class="ghost" type="button" id="shuffleBtn">Shuffle</button>
        </div>

        <ul class="music-list" id="trackList"></ul>
      </div>
    </main>

    <aside class="right-panel">
      <div class="cover" id="coverBox" aria-live="polite">♪</div>

      <div class="track-info">
        <div class="now-playing-label">Now playing</div>
        <div class="track-name" id="currentTitle">Choose a song</div>
        <div class="artist-name" id="currentArtist">Your playlist is waiting</div>
      </div>

      <div class="progress">
        <span id="currentTime">0:00</span>
        <input id="progressBar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek song" />
        <span id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <button class="control-btn" type="button" id="prevBtn" aria-label="Previous">⏮</button>
        <button class="control-btn primary" type="button" id="playPauseBtn" aria-label="Play or pause">▶</button>
        <button class="control-btn" type="button" id="nextBtn" aria-label="Next">⏭</button>
      </div>

      <div class="small-actions">
        <button class="ghost" id="likeBtn" type="button">♥ Like</button>
        <button class="ghost" id="queueBtn" type="button">+ Queue</button>
        <button class="ghost" id="shareBtn" type="button">↗ Share</button>
        <button class="ghost" id="lyricsBtn" type="button" aria-expanded="false">Lyrics</button>
      </div>

      <div class="lyrics-panel" id="lyricsPanel" aria-live="polite"></div>
    </aside>
  </div>

  <script>
    const audio = new Audio();
    const defaultSongs = [
      {
        id: 's1',
        title: 'Midnight Rain',
        artist: 'Luna Harbor',
        duration: 200,
        cover: '🌙',
        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
        lyrics: [
          'The city glows in silver haze',
          'A lonely beat keeps time',
          'We chase the moon through midnight rain',
          'And every drop says stay a little longer',
          'I hear your name in every quiet street',
          'And the stars lean close to listen'
        ]
      },
      {
        id: 's2',
        title: 'Velvet Skies',
        artist: 'Nova Bloom',
        duration: 216,
        cover: '☁️',
        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
        lyrics: [
          'We drift beneath the velvet skies',
          'With color fading into dream',
          'Your laughter moves like evening light',
          'Across the warm horizon',
          'Every second feels like a promise',
          'Waiting there in the blue'
        ]
      },
      {
        id: 's3',
        title: 'Neon Alley',
        artist: 'Catline',
        duration: 188,
        cover: '✨',
        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
        lyrics: [
          'Neon sparks on a narrow street',
          'The world turns soft and slow',
          'We walk like shadows in a dream',
          'Under a purple evening glow',
          'If the night can hold this moment',
          'Then I will never let it go'
        ]
      },
      {
        id: 's4',
        title: 'Sunset Thread',
        artist: 'Pine & Echo',
        duration: 234,
        cover: '🌅',
        url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3',
        lyrics: [
          'The sunset threads the sky in gold',
          'A quiet song beneath the trees',
          'I keep your heartbeat in my pocket',
          'Like a secret no one sees',
          'When the evening folds to night',
          'I still feel the warmth you gave me'
        ]
      }
    ];

    const state = {
      activePlaylist: 'playlist-main',
      playlists: {
        'playlist-main': { id: 'playlist-main', name: 'My Playlist', songs: [...defaultSongs] },
        'liked-songs': { id: 'liked-songs', name: 'Liked Songs', songs: [] }
      },
      currentTrackId: null,
      currentIndex: 0,
      search: '',
      shuffle: false,
      lyricsOpen: false,
      queue: []
    };

    const els = {
      playlistSidebar: document.getElementById('playlistSidebar'),
      trackList: document.getElementById('trackList'),
      playlistTitle: document.getElementById('playlistTitle'),
      filterInput: document.getElementById('filterInput'),
      playAllBtn: document.getElementById('playAllBtn'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      newPlaylistBtn: document.getElementById('newPlaylistBtn'),
      currentTitle: document.getElementById('currentTitle'),
      currentArtist: document.getElementById('currentArtist'),
      currentTime: document.getElementById('currentTime'),
      totalTime: document.getElementById('totalTime'),
      progressBar: document.getElementById('progressBar'),
      coverBox: document.getElementById('coverBox'),
      playPauseBtn: document.getElementById('playPauseBtn'),
      likeBtn: document.getElementById('likeBtn'),
      queueBtn: document.getElementById('queueBtn'),
      shareBtn: document.getElementById('shareBtn'),
      lyricsBtn: document.getElementById('lyricsBtn'),
      lyricsPanel: document.getElementById('lyricsPanel'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn')
    };

    function getActiveSongs() {
      return state.playlists[state.activePlaylist].songs;
    }

    function formatTime(sec) {
      const safe = Number.isFinite(sec) ? Math.max(0, sec) : 0;
      const mins = Math.floor(safe / 60);
      const secs = Math.floor(safe % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function isLiked(id) {
      return state.playlists['liked-songs'].songs.some(song => song.id === id);
    }

    function syncLikedSongs() {
      const liked = state.playlists['liked-songs'].songs;
      const likedIds = new Set(liked.map(s => s.id));
      for (const playlist of Object.values(state.playlists)) {
        playlist.songs.forEach(song => {
          song.liked = likedIds.has(song.id);
        });
      }
    }

    function updatePlaylistSidebar() {
      const items = Object.values(state.playlists);
      els.playlistSidebar.innerHTML = items.map(list => `
        <li>
          <button type="button" class="playlist-item ${state.activePlaylist === list.id ? 'active' : ''}" data-playlist-id="${list.id}">
            <span class="playlist-pill">${list.name === 'Liked Songs' ? '♥' : list.name.slice(0, 2).toUpperCase()}</span>
            <span class="playlist-name">${list.name}</span>
            <span class="playlist-count">${list.songs.length}</span>
          </button>
        </li>
      `).join('');

      document.querySelectorAll('[data-playlist-id]').forEach(button => {
        button.addEventListener('click', () => {
          state.activePlaylist = button.dataset.playlistId;
          state.currentTrackId = null;
          state.currentIndex = 0;
          render();
        });
      });
    }

    function getFilteredSongs() {
      const songs = getActiveSongs();
      if (!state.search.trim()) return songs;
      const query = state.search.toLowerCase();
      return songs.filter(song => `${song.title} ${song.artist}`.toLowerCase().includes(query));
    }

    function renderTracks() {
      const songs = getFilteredSongs();
      els.trackList.innerHTML = songs.length
        ? songs.map((song, idx) => {
            const actualIndex = getActiveSongs().findIndex(item => item.id === song.id);
            const active = state.currentTrackId === song.id ? 'active' : '';
            return `
              <li>
                <button class="track ${active}" type="button" data-track-id="${song.id}" data-index="${actualIndex}">
                  <span class="track-number">${actualIndex + 1}</span>
                  <span class="track-main">
                    <span class="track-title">${song.title}</span>
                    <span class="track-artist">${song.artist}</span>
                  </span>
                  <span class="meta-badge">${song.cover}</span>
                  <span class="meta-badge">${formatTime(song.duration)}</span>
                  <span class="meta-badge">
                    <button class="heart ${song.liked ? 'liked' : ''}" type="button" data-like-id="${song.id}" aria-label="Like ${song.title}">${song.liked ? '♥' : '♡'}</button>
                    <button class="queue-btn" type="button" data-queue-id="${song.id}">+ Queue</button>
                    <button class="share-btn" type="button" data-share-id="${song.id}">Share</button>
                  </span>
                </button>
              </li>
            `;
          }).join('')
        : '<li class="empty">No songs match the current filter.</li>';

      els.trackList.querySelectorAll('[data-track-id]').forEach(button => {
        button.addEventListener('click', (event) => {
          const node = event.target.closest('[data-track-id]');
          if (!node) return;
          const songId = node.dataset.trackId;
          const index = Number(node.dataset.index);
          playTrackById(songId, index);
        });
      });

      els.trackList.querySelectorAll('[data-like-id]').forEach(button => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const songId = button.dataset.likeId;
          toggleLike(songId);
        });
      });

      els.trackList.querySelectorAll('[data-queue-id]').forEach(button => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          addToQueue(button.dataset.queueId);
        });
      });

      els.trackList.querySelectorAll('[data-share-id]').forEach(button => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          shareSong(button.dataset.shareId);
        });
      });
    }

    function renderPlayer() {
      const currentSong = getCurrentSong();
      const isPlaying = !audio.paused && !audio.ended;

      els.playPauseBtn.textContent = isPlaying ? '❚❚' : '▶';
      els.playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      els.currentTitle.textContent = currentSong ? currentSong.title : 'Choose a song';
      els.currentArtist.textContent = currentSong ? currentSong.artist : 'Your playlist is waiting';
      els.currentTime.textContent = formatTime(audio.currentTime || 0);
      els.totalTime.textContent = currentSong ? formatTime(currentSong.duration || audio.duration || 0) : '0:00';

      if (currentSong) {
        els.progressBar.max = currentSong.duration || 100;
        els.progressBar.value = audio.currentTime || 0;
        els.coverBox.innerHTML = currentSong.cover ? `<div style="font-size: 4rem;">${currentSong.cover}</div>` : '';
      } else {
        els.progressBar.max = 100;
        els.progressBar.value = 0;
        els.coverBox.innerHTML = '♪';
      }

      if (currentSong) {
        const liked = isLiked(currentSong.id);
        els.likeBtn.textContent = liked ? '♥ Liked' : '♡ Like';
        els.likeBtn.classList.toggle('primary', liked);
      } else {
        els.likeBtn.textContent = '♥ Like';
        els.likeBtn.classList.remove('primary');
      }

      renderLyrics();
    }

    function renderLyrics() {
      const song = getCurrentSong();
      const panel = els.lyricsPanel;
      if (!song || !state.lyricsOpen) {
        panel.classList.remove('visible');
        panel.innerHTML = '';
        return;
      }

      const lines = song.lyrics || ['Lyrics coming soon.'];
      panel.classList.add('visible');
      panel.innerHTML = lines.map((line, index) => `<div class="lyric-line ${index === getActiveLyricIndex(song) ? 'active' : ''}" data-lyric-index="${index}">${line}</div>`).join('');

      const active = panel.querySelector('.lyric-line.active');
      if (active) {
        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function getCurrentSong() {
      if (!state.currentTrackId) return null;
      const songs = getActiveSongs();
      return songs.find(song => song.id === state.currentTrackId) || null;
    }

    function playTrackById(songId, index = 0) {
      const songs = getActiveSongs();
      const song = songs.find(item => item.id === songId) || songs[index] || songs[0];
      if (!song) return;

      state.currentTrackId = song.id;
      state.currentIndex = getActiveSongs().findIndex(item => item.id === song.id);
      audio.src = song.url;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      render();
    }

    function playAll() {
      const songs = getFilteredSongs();
      if (!songs.length) return;
      playTrackById(songs[0].id, 0);
    }

    function toggleLike(songId) {
      const likedList = state.playlists['liked-songs'];
      const songs = getActiveSongs();
      const song = songs.find(item => item.id === songId);
      if (!song) return;

      if (isLiked(songId)) {
        likedList.songs = likedList.songs.filter(item => item.id !== songId);
      } else {
        likedList.songs.push({ ...song, liked: true });
      }
      syncLikedSongs();
      render();
    }

    function addToQueue(songId) {
      const songs = [...state.playlists['playlist-main'].songs, ...state.playlists['liked-songs'].songs];
      const song = songs.find(item => item.id === songId);
      if (!song) return;
      if (!state.queue.some(item => item.id === songId)) {
        state.queue.push(song);
      }
      if (!state.currentTrackId) {
        playTrackById(song.id);
      }
    }

    function shareSong(songId) {
      const song = getCurrentSong() || defaultSongs.find(item => item.id === songId);
      if (!song) return;
      const shareText = `Listening to ${song.title} by ${song.artist} on Meow Music`;
      if (navigator.share) {
        navigator.share({ title: song.title, text: shareText, url: location.href }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText).catch(() => {});
        alert('Share text copied to your clipboard.');
      } else {
        alert(shareText);
      }
    }

    function getActiveLyricIndex(song) {
      if (!song || !song.lyrics) return 0;
      const current = audio.currentTime || 0;
      const total = song.duration || 1;
      const ratio = Math.min(1, Math.max(0, current / total));
      return Math.min(song.lyrics.length - 1, Math.floor(ratio * song.lyrics.length));
    }

    function toggleLyrics() {
      state.lyricsOpen = !state.lyricsOpen;
      els.lyricsBtn.setAttribute('aria-expanded', String(state.lyricsOpen));
      renderLyrics();
    }

    function nextTrack() {
      const songs = getActiveSongs();
      if (!songs.length) return;
      let nextIndex = state.currentIndex + 1;
      if (state.shuffle) {
        nextIndex = Math.floor(Math.random() * songs.length);
      } else if (nextIndex >= songs.length) {
        nextIndex = 0;
      }
      playTrackById(songs[nextIndex].id, nextIndex);
    }

    function prevTrack() {
      const songs = getActiveSongs();
      if (!songs.length) return;
      let prevIndex = state.currentIndex - 1;
      if (state.shuffle) {
        prevIndex = Math.floor(Math.random() * songs.length);
      } else if (prevIndex < 0) {
        prevIndex = songs.length - 1;
      }
      playTrackById(songs[prevIndex].id, prevIndex);
    }

    function setupAudioEvents() {
      audio.addEventListener('timeupdate', () => {
        renderPlayer();
      });

      audio.addEventListener('play', () => renderPlayer());
      audio.addEventListener('pause', () => renderPlayer());
      audio.addEventListener('ended', () => nextTrack());
      audio.addEventListener('loadedmetadata', () => renderPlayer());
    }

    function bindControls() {
      els.filterInput.addEventListener('input', (event) => {
        state.search = event.target.value;
        renderTracks();
      });

      els.playAllBtn.addEventListener('click', playAll);
      els.shuffleBtn.addEventListener('click', () => {
        state.shuffle = !state.shuffle;
        els.shuffleBtn.classList.toggle('primary', state.shuffle);
      });

      els.newPlaylistBtn.addEventListener('click', () => {
        const name = prompt('Name your new playlist', 'Playlist ' + (Object.keys(state.playlists).length + 1));
        if (!name) return;
        const id = `playlist-${Date.now()}`;
        state.playlists[id] = { id, name, songs: [] };
        state.activePlaylist = id;
        render();
      });

      els.playPauseBtn.addEventListener('click', () => {
        if (!getCurrentSong()) {
          playAll();
          return;
        }
        if (audio.paused) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });

      els.prevBtn.addEventListener('click', prevTrack);
      els.nextBtn.addEventListener('click', nextTrack);
      els.progressBar.addEventListener('input', (event) => {
        const song = getCurrentSong();
        if (!song) return;
        const value = Number(event.target.value);
        audio.currentTime = value;
        renderPlayer();
      });

      els.likeBtn.addEventListener('click', () => {
        const current = getCurrentSong();
        if (!current) return;
        toggleLike(current.id);
      });

      els.queueBtn.addEventListener('click', () => {
        const current = getCurrentSong();
        if (current) addToQueue(current.id);
      });

      els.shareBtn.addEventListener('click', () => {
        const current = getCurrentSong();
        if (current) shareSong(current.id);
      });

      els.lyricsBtn.addEventListener('click', toggleLyrics);
    }

    function render() {
      syncLikedSongs();
      updatePlaylistSidebar();
      els.playlistTitle.textContent = state.playlists[state.activePlaylist].name;
      renderTracks();
      renderPlayer();
    }

    function init() {
      syncLikedSongs();
      bindControls();
      setupAudioEvents();
      render();
      state.currentTrackId = defaultSongs[0].id;
      state.currentIndex = 0;
      playTrackById(defaultSongs[0].id, 0);
      audio.pause();
      render();
    }

    init();
  </script>
</body>
</html>
